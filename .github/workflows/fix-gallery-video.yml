name: Apply gallery video fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch homepage video
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="script.js"></script>'
          tag = '<script src="video-control.js"></script>'

          if tag not in text:
              if marker not in text:
                  raise SystemExit('Could not find script.js include in index.html')
              text = text.replace(marker, f'{tag}\n{marker}', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-gallery-video.yml

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-gallery-video.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: pause gallery video when inactive'
          git push
