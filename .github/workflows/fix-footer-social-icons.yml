name: Fix footer social icons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace footer text with inline SVG icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = ['index.html', 'about.html', 'courses.html', 'gallery.html']
          old = '''<a href="https://www.facebook.com/p/CICE-Computer-Institute-Halakura-100089602022179/" target="_blank" rel="noopener">Facebook</a>\n            <a href="https://www.instagram.com/cice_computer_halakura/" target="_blank" rel="noopener">Instagram</a>'''
          new = '''<a href="https://www.facebook.com/p/CICE-Computer-Institute-Halakura-100089602022179/" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook"><svg class="footer-social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.7V4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9V10H8v3h2.7v8h2.8Z"/></svg></a>\n            <a href="https://www.instagram.com/cice_computer_halakura/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"><svg class="footer-social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M7.2 2h9.6A5.2 5.2 0 0 1 22 7.2v9.6a5.2 5.2 0 0 1-5.2 5.2H7.2A5.2 5.2 0 0 1 2 16.8V7.2A5.2 5.2 0 0 1 7.2 2Zm0 2A3.2 3.2 0 0 0 4 7.2v9.6A3.2 3.2 0 0 0 7.2 20h9.6a3.2 3.2 0 0 0 3.2-3.2V7.2A3.2 3.2 0 0 0 16.8 4H7.2Zm4.8 3.1A4.9 4.9 0 1 1 7.1 12 4.9 4.9 0 0 1 12 7.1Zm0 2A2.9 2.9 0 1 0 14.9 12 2.9 2.9 0 0 0 12 9.1Zm5.1-3.4a1.15 1.15 0 1 1-1.15 1.15A1.15 1.15 0 0 1 17.1 5.7Z"/></svg></a>'''
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              if old in s:
                  p.write_text(s.replace(old, new))
          PY
      - name: Redesign founder credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          old = '''                <div class="experience-chip"><strong>10+ Years</strong><span>Teaching Experience</span></div>'''
          new = '''                <div class="founder-credentials" aria-label="Founder credentials">
                    <div class="founder-credential">
                        <div class="founder-credential-icon" aria-hidden="true">🎓</div>
                        <div class="founder-credential-text"><strong>MSc IT</strong><span>Academic Qualification</span></div>
                    </div>
                    <div class="founder-credential">
                        <div class="founder-credential-icon" aria-hidden="true">✦</div>
                        <div class="founder-credential-text"><strong>10+ Years</strong><span>Teaching Experience</span></div>
                    </div>
                </div>'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'class="founder-credentials"' not in s:
              raise SystemExit('Experience chip not found.')
          old2 = '''                <div class="founder-details">
                    <div class="founder-detail"><small>QUALIFICATION</small><strong>MSc IT</strong></div>
                </div>'''
          s = s.replace(old2, '', 1)
          css = '''<style id="founder-credentials-refinement">
.founder-credentials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0 4px}
.founder-credential{display:flex;align-items:center;gap:12px;min-width:0;padding:14px 15px;border:1px solid rgba(31,119,255,.12);border-radius:16px;background:linear-gradient(135deg,#f7fbff,#eef8ff);box-shadow:0 8px 22px rgba(31,119,255,.07)}
.founder-credential-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:11px;background:#e5f4ff;font-size:18px;line-height:1}
.founder-credential-text{display:flex;flex-direction:column;min-width:0}
.founder-credential-text strong{font-size:17px;line-height:1.2;color:var(--ink,#10233f)}
.founder-credential-text span{margin-top:3px;font-size:11px;line-height:1.3;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#66809e}
@media (max-width:560px){.founder-credentials{grid-template-columns:1fr}}
</style>
'''
          if 'id="founder-credentials-refinement"' not in s:
              s = s.replace('</head>', css+'</head>', 1)
          p.write_text(s, encoding='utf-8')
          print('Founder credentials redesigned.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html courses.html gallery.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Redesign founder credentials"
          git push
