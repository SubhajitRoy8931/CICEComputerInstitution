name: Fix footer social icons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace footer text with inline SVG icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = ['index.html', 'about.html', 'courses.html', 'gallery.html']
          old = '''<a href="https://www.facebook.com/p/CICE-Computer-Institute-Halakura-100089602022179/" target="_blank" rel="noopener">Facebook</a>\n            <a href="https://www.instagram.com/cice_computer_halakura/" target="_blank" rel="noopener">Instagram</a>'''
          new = '''<a href="https://www.facebook.com/p/CICE-Computer-Institute-Halakura-100089602022179/" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook"><svg class="footer-social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.7V4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9V10H8v3h2.7v8h2.8Z"/></svg></a>\n            <a href="https://www.instagram.com/cice_computer_halakura/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"><svg class="footer-social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M7.2 2h9.6A5.2 5.2 0 0 1 22 7.2v9.6a5.2 5.2 0 0 1-5.2 5.2H7.2A5.2 5.2 0 0 1 2 16.8V7.2A5.2 5.2 0 0 1 7.2 2Zm0 2A3.2 3.2 0 0 0 4 7.2v9.6A3.2 3.2 0 0 0 7.2 20h9.6a3.2 3.2 0 0 0 3.2-3.2V7.2A3.2 3.2 0 0 0 16.8 4H7.2Zm4.8 3.1A4.9 4.9 0 1 1 7.1 12 4.9 4.9 0 0 1 12 7.1Zm0 2A2.9 2.9 0 1 0 14.9 12 2.9 2.9 0 0 0 12 9.1Zm5.1-3.4a1.15 1.15 0 1 1-1.15 1.15A1.15 1.15 0 0 1 17.1 5.7Z"/></svg></a>'''
          changed = False
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              if old in s:
                  p.write_text(s.replace(old, new))
                  changed = True
          if changed:
              print('Footer social icons updated.')
          else:
              print('Footer social icons already updated.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html courses.html gallery.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore footer social icons"
          git push
