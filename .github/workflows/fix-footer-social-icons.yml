name: Fix footer social icons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Redesign founder credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          old = '''                <div class="experience-chip"><strong>10+ Years</strong><span>Teaching Experience</span></div>'''
          new = '''                <div class="founder-credentials" aria-label="Founder credentials">
                    <div class="founder-credential">
                        <div class="founder-credential-icon" aria-hidden="true">🎓</div>
                        <div class="founder-credential-text"><strong>MSc IT</strong><span>Academic Qualification</span></div>
                    </div>
                    <div class="founder-credential">
                        <div class="founder-credential-icon" aria-hidden="true">✦</div>
                        <div class="founder-credential-text"><strong>10+ Years</strong><span>Teaching Experience</span></div>
                    </div>
                </div>'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'class="founder-credentials"' not in s:
              raise SystemExit('Experience chip not found.')
          old2 = '''                <div class="founder-details">
                    <div class="founder-detail"><small>QUALIFICATION</small><strong>MSc IT</strong></div>
                </div>'''
          s = s.replace(old2, '', 1)
          css = '''<style id="founder-credentials-refinement">
.founder-credentials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0 4px}
.founder-credential{display:flex;align-items:center;gap:12px;min-width:0;padding:14px 15px;border:1px solid rgba(31,119,255,.12);border-radius:16px;background:linear-gradient(135deg,#f7fbff,#eef8ff);box-shadow:0 8px 22px rgba(31,119,255,.07)}
.founder-credential-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:11px;background:#e5f4ff;font-size:18px;line-height:1}
.founder-credential-text{display:flex;flex-direction:column;min-width:0}
.founder-credential-text strong{font-size:17px;line-height:1.2;color:var(--ink,#10233f)}
.founder-credential-text span{margin-top:3px;font-size:11px;line-height:1.3;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#66809e}
@media (max-width:560px){.founder-credentials{grid-template-columns:1fr}}
</style>
'''
          if 'id="founder-credentials-refinement"' not in s:
              s = s.replace('</head>', css+'</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Redesign founder credentials"
          git push
