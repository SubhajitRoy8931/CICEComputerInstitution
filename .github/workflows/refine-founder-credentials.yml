name: Refine founder credentials
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-founder-credentials.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply founder credential redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          old = '''                <div class="founder-credentials" aria-label="Founder credentials">
                    <span class="founder-credential">🎓 MSc IT</span>
                    <span class="founder-credential-separator" aria-hidden="true">·</span>
                    <span class="founder-credential">10+ Years of Teaching Experience</span>
                </div>'''
          if old in s:
              new = '''                <div class="founder-credentials" aria-label="Founder credentials">
                    <div class="founder-credential">
                        <span class="founder-credential-icon" aria-hidden="true">🎓</span>
                        <span class="founder-credential-copy">
                            <strong>MSc IT</strong>
                            <small>Qualification</small>
                        </span>
                    </div>
                    <div class="founder-credential">
                        <span class="founder-credential-icon" aria-hidden="true">◷</span>
                        <span class="founder-credential-copy">
                            <strong>10+ Years</strong>
                            <small>Teaching Experience</small>
                        </span>
                    </div>
                </div>'''
              s = s.replace(old, new, 1)
          start = s.find('<style id="founder-credentials-refinement">')
          end = s.find('</style>', start)
          if start == -1 or end == -1:
              raise SystemExit('Founder credential style block not found')
          css = '''<style id="founder-credentials-refinement">
.founder-credentials {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 22px 0 24px;
    max-width: 540px;
}
.founder-credential {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    min-height: 68px;
    padding: 12px 15px;
    background: linear-gradient(135deg, #f8fbff 0%, #eef7ff 100%);
    border: 1px solid #d5e8f7;
    border-radius: 12px;
    box-shadow: 0 5px 16px rgba(20, 74, 120, 0.06);
}
.founder-credential-icon {
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: #e1f1ff;
    color: var(--blue);
    font-size: 17px;
    line-height: 1;
}
.founder-credential-copy {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
}
.founder-credential strong {
    color: var(--navy);
    font-size: .94rem;
    line-height: 1.15;
    font-weight: 800;
}
.founder-credential small {
    color: var(--muted);
    font-size: .67rem;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
}
@media (max-width: 700px) {
    .founder-credentials { gap: 9px; }
    .founder-credential { padding: 11px 12px; }
}
@media (max-width: 520px) {
    .founder-credentials { grid-template-columns: 1fr; max-width: 360px; }
}
</style>'''
          s = s[:start] + css + s[end + len('</style>'):]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git rm .github/workflows/refine-founder-credentials.yml
          git commit -m "Properly redesign founder credentials"
          git push
