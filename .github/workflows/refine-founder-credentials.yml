name: Refine founder credentials
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-founder-credentials.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine founder credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          old = '''                <div class="founder-credentials" aria-label="Founder credentials">
                    <span class="founder-credential">🎓 MSc IT</span>
                    <span class="founder-credential-separator" aria-hidden="true">·</span>
                    <span class="founder-credential">10+ Years of Teaching Experience</span>
                </div>'''
          new = '''                <div class="founder-credentials" aria-label="Founder credentials">
                    <div class="founder-credential">
                        <span class="founder-credential-icon" aria-hidden="true">🎓</span>
                        <span>
                            <strong>MSc IT</strong>
                            <small>Qualification</small>
                        </span>
                    </div>
                    <div class="founder-credential">
                        <span class="founder-credential-icon" aria-hidden="true">◷</span>
                        <span>
                            <strong>10+ Years</strong>
                            <small>Teaching Experience</small>
                        </span>
                    </div>
                </div>'''
          if old not in s:
              raise SystemExit('Current founder credential block not found')
          s = s.replace(old, new, 1)
          start = s.find('<style id="founder-credentials-refinement">')
          end = s.find('</style>', start)
          if start == -1 or end == -1:
              raise SystemExit('Founder credential style block not found')
          css = '''<style id="founder-credentials-refinement">
.founder-credentials {
    display: flex;
    align-items: stretch;
    gap: 12px;
    margin: 22px 0 24px;
}
.founder-credential {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    padding: 11px 15px;
    background: rgba(31, 119, 255, 0.055);
    border: 1px solid rgba(31, 119, 255, 0.14);
    border-radius: 12px;
}
.founder-credential-icon {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: #ffffff;
    color: var(--blue);
    font-size: 16px;
    line-height: 1;
}
.founder-credential > span:last-child {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.founder-credential strong {
    color: var(--navy);
    font-size: .84rem;
    line-height: 1.15;
    white-space: nowrap;
}
.founder-credential small {
    color: var(--muted);
    font-size: .68rem;
    line-height: 1.15;
    font-weight: 600;
    white-space: nowrap;
}
@media (max-width: 700px) {
    .founder-credentials {
        gap: 8px;
    }
    .founder-credential {
        padding: 10px 12px;
    }
}
@media (max-width: 520px) {
    .founder-credentials {
        flex-direction: column;
    }
    .founder-credential strong,
    .founder-credential small {
        white-space: normal;
    }
}
</style>'''
          s = s[:start] + css + s[end + len('</style>'):]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git rm .github/workflows/refine-founder-credentials.yml
          git commit -m "Refine founder credentials layout"
          git push
