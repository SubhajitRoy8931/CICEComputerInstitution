# One-time Step 3 interaction fix
name: Step 3 testimonial interaction fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/step3-testimonial-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply JavaScript fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          old = '            let startTranslate = 0;\n'
          new = '            let startTranslate = 0;\n            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");\n\n            const shouldAnimate = () => !reduceMotion.matches;\n'
          if old not in text:
              raise SystemExit('Could not find testimonial state block.')
          text = text.replace(old, new, 1)

          old = '''                testimonialGrid.style.transition = animate
                    ? "transform .65s cubic-bezier(.22,.61,.36,1)"
                    : "none";
                testimonialGrid.style.transform = `translate3d(${centeredX(index)}px,0,0)`;
'''
          new = '''                const animateNow = animate && shouldAnimate();
                testimonialGrid.style.transition = animateNow
                    ? "transform .65s cubic-bezier(.22,.61,.36,1)"
                    : "none";
                testimonialGrid.style.transform = `translate3d(${centeredX(index)}px,0,0)`;
                if (!animateNow) moving = false;
'''
          if old not in text:
              raise SystemExit('Could not find testimonial render block.')
          text = text.replace(old, new, 1)

          old = '''                if (moving) return;
                moving = true;
                index += direction;
                render(true);
'''
          new = '''                if (moving) return;
                index += direction;
                if (!shouldAnimate()) {
                    render(false);
                    normalize();
                    moving = false;
                    return;
                }
                moving = true;
                render(true);
'''
          if old not in text:
              raise SystemExit('Could not find testimonial move block.')
          text = text.replace(old, new, 1)

          old = '                testimonialGrid.setPointerCapture?.(e.pointerId);\n'
          new = '                viewport.setPointerCapture?.(e.pointerId);\n'
          if old not in text:
              raise SystemExit('Could not find pointer capture block.')
          text = text.replace(old, new, 1)

          old = '                testimonialGrid.releasePointerCapture?.(e.pointerId);\n'
          new = '                viewport.releasePointerCapture?.(e.pointerId);\n'
          if old not in text:
              raise SystemExit('Could not find pointer release block.')
          text = text.replace(old, new, 1)

          old = '            window.addEventListener("resize", () => render(false));\n'
          new = '            window.addEventListener("resize", () => render(false));\n            reduceMotion.addEventListener?.("change", () => render(false));\n'
          if old not in text:
              raise SystemExit('Could not find testimonial resize block.')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          node --check script.js

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js .github/workflows/step3-testimonial-fix.yml
          git commit -m "fix: harden testimonial carousel interactions" -- script.js .github/workflows/step3-testimonial-fix.yml
          git rm .github/workflows/step3-testimonial-fix.yml
          git commit -m "chore: remove temporary step 3 workflow"
          git push
