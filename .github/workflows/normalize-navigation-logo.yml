name: Normalize navigation logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize logo link on every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          canonical = '''<a href="index.html" class="brand" aria-label="CICE Computer Institute - Home">
              <img src="assets/images/cice-logo-nav.png" alt="CICE Computer Institute official logo" class="brand-logo">
          </a>'''

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(r'<a\s+href="[^"]*"\s+class="brand"\s+aria-label="CICE Computer Institute - Home">\s*<img\s+src="[^"]*"\s+alt="CICE Computer Institute official logo"\s+class="brand-logo">\s*</a>', re.I)
              new_text, count = pattern.subn(canonical, text)
              if count:
                  path.write_text(new_text, encoding='utf-8')
                  print(f'Normalized {path}: {count} logo link(s)')
              else:
                  print(f'No matching logo block in {path}')
          PY
      - name: Commit normalized navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Normalize logo link to homepage on all pages"
            git push
          fi
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/normalize-navigation-logo.yml
          git add .github/workflows/normalize-navigation-logo.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove temporary navigation workflow"
          git push
