# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  prepare-media:
    name: Prepare gallery media
    if: github.event.head_commit.message != 'Apply gallery media fixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Fix gallery structure and media
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          gallery = Path('gallery.html')
          text = gallery.read_text(encoding='utf-8')

          # Move the gallery-specific script inside the real body element.
          marker = '<script>\n/* Add each media item once.'
          start = text.find(marker)
          if start != -1:
              script_end = text.find('</script>', start)
              if script_end == -1:
                  raise SystemExit('Gallery script closing tag not found')
              script_end += len('</script>')
              gallery_script = text[start:script_end]
              text = text[:start].rstrip() + '\n' + text[script_end:]
              text = text.replace('</body>\n</html>\n\n</body>\n</html>', '</body>\n</html>')
              body_close = text.rfind('</body>')
              text = text[:body_close].rstrip() + '\n\n' + gallery_script + '\n' + text[body_close:]

          # Use a poster extracted from the actual video.
          text = text.replace(
              "poster: 'assets/images/gallery/life-03.jpg'",
              "poster: 'assets/images/gallery/a-glimpse-of-cice-poster.jpg'"
          )

          # Deliberate widths: desktop shows three full cards with partial
          # neighbours, tablet shows two, and mobile shows one.
          text = text.replace('flex: 0 0 25%;', 'flex: 0 0 32%;')
          text = text.replace('flex-basis: 35%;', 'flex-basis: 40%;')
          text = text.replace('flex-basis: 70%;', 'flex-basis: 65%;')

          # Remove stale selectors and keep Recognition photo-only.
          text = re.sub(
              r'<style id="gallery-final-media-rules">.*?</style>',
              '''<style id="gallery-final-media-rules">\n/* Recognition & Credentials is intentionally document/photo-only. */\n.gallery-recognition .media-play,\n.gallery-recognition .media-type,\n.gallery-recognition video {\n  display: none !important;\n}\n\n/* Keep the first four collections eligible for their View All controls. */\n.gallery-all-media .view-all,\n.gallery-life .view-all,\n.gallery-moments .view-all,\n.gallery-internships .view-all {\n  display: inline-flex;\n}\n</style>''',
              text,
              flags=re.S
          )

          # Gracefully handle an unavailable video in the card.
          old = """        card.appendChild(video);\n\n        const play = document.createElement('span');"""
          new = """        video.onerror = () => {\n            video.style.display = 'none';\n            const placeholder = document.createElement('div');\n            placeholder.className = 'media-placeholder';\n            placeholder.innerHTML = `\n                <div>\n                    <strong>${item.title}</strong>\n                    <span>Video could not be loaded.</span>\n                </div>\n            `;\n            card.appendChild(placeholder);\n        };\n\n        card.appendChild(video);\n\n        const play = document.createElement('span');"""
          if old in text:
              text = text.replace(old, new, 1)

          # Graceful fullscreen-video failure state.
          old_modal = """        if (item.poster) {\n            video.poster = item.poster;\n        }\n\n        stage.appendChild(video);"""
          new_modal = """        if (item.poster) {\n            video.poster = item.poster;\n        }\n\n        video.addEventListener('error', () => {\n            stage.innerHTML = '';\n            const fallback = document.createElement('p');\n            fallback.className = 'media-modal-caption';\n            fallback.textContent = 'This video could not be played in this browser.';\n            stage.appendChild(fallback);\n        });\n\n        stage.appendChild(video);"""
          if old_modal in text:
              text = text.replace(old_modal, new_modal, 1)

          gallery.write_text(text, encoding='utf-8')
          PY

          # Transcode only when the current video is not already H.264.
          codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 assets/videos/a-glimpse-of-cice.mp4)
          if [ "$codec" != "h264" ]; then
            ffmpeg -y -i assets/videos/a-glimpse-of-cice.mp4 \
              -c:v libx264 -profile:v high -level 4.1 -pix_fmt yuv420p \
              -preset medium -crf 22 -movflags +faststart \
              -c:a aac -b:a 128k \
              assets/videos/a-glimpse-of-cice-web.mp4
            mv assets/videos/a-glimpse-of-cice-web.mp4 assets/videos/a-glimpse-of-cice.mp4
          fi

          # Extract a poster from the actual video.
          ffmpeg -y -ss 00:00:08 -i assets/videos/a-glimpse-of-cice.mp4 \
            -frames:v 1 -q:v 2 assets/images/gallery/a-glimpse-of-cice-poster.jpg

      - name: Verify media and document structure
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -of default=nw=1 assets/videos/a-glimpse-of-cice.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1 assets/videos/a-glimpse-of-cice.mp4
          test "$(grep -c '^</body>$' gallery.html)" -eq 1
          test "$(grep -c '^</html>$' gallery.html)" -eq 1
          grep -q "assets/videos/a-glimpse-of-cice.mp4" gallery.html
          grep -q "assets/images/gallery/a-glimpse-of-cice-poster.jpg" gallery.html

      - name: Commit prepared media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery.html assets/videos/a-glimpse-of-cice.mp4 assets/images/gallery/a-glimpse-of-cice-poster.jpg
          if git diff --cached --quiet; then
            echo "No preparation changes required."
          else
            git commit -m "Apply gallery media fixes"
            git push
          fi

  deploy:
    name: Deploy GitHub Pages
    needs: prepare-media
    if: always() && (needs.prepare-media.result == 'success' || needs.prepare-media.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
