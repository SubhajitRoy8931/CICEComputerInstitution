name: Update CICE gallery video path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-cice-video.yml'
      - 'assets/videos/a-glimpse-of-cice.mp4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Point gallery video to assets/videos
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gallery.html')
          text = path.read_text(encoding='utf-8')

          old = "src: 'videos/a-glimpse-of-cice.mp4'"
          new = "src: 'assets/videos/a-glimpse-of-cice.mp4'"

          if new in text:
              print('Gallery already points to assets/videos.')
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Gallery video path updated.')
          else:
              raise SystemExit('Expected gallery video path was not found.')
          PY

      - name: Commit gallery change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery.html
          git rm .github/workflows/add-cice-video.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "Move gallery video into assets/videos"
          git push
