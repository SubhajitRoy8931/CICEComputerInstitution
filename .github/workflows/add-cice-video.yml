name: Add CICE gallery video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-cice-video.yml'
      - 'videos/a-glimpse-of-cice.mp4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add A Glimpse of CICE to the gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gallery.html')
          text = path.read_text(encoding='utf-8')

          marker = "title: 'A Glimpse of CICE'"
          if marker not in text:
              needle = "const CICE_MEDIA = [\n"
              block = """const CICE_MEDIA = [
              {
                  type: 'video',
                  category: 'life',
                  src: 'videos/a-glimpse-of-cice.mp4',
                  poster: 'assets/images/gallery/life-03.jpg',
                  title: 'A Glimpse of CICE',
                  alt: 'A short video showcasing CICE Computer Institute, its computer lab, learning environment and students',
                  pinned: true
              },
          """

              if needle not in text:
                  raise SystemExit('CICE_MEDIA declaration not found')

              text = text.replace(needle, block, 1)
              path.write_text(text, encoding='utf-8')
          else:
              print('A Glimpse of CICE is already present; no gallery change needed.')
          PY

      - name: Commit gallery change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery.html
          git rm .github/workflows/add-cice-video.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "Add A Glimpse of CICE to gallery"
          git push
