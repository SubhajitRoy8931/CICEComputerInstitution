name: Fix About Navigation Logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-about-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore About navigation logo with homepage link
        shell: python
        run: |
          from pathlib import Path
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          old = '''    <nav class="navbar container">\n\n\n    <button class="menu-toggle"'''
          new = '''    <nav class="navbar container">\n    <a href="index.html" class="brand" aria-label="CICE Computer Institute - Home">\n        <img src="assets/images/cice-logo-nav.png" alt="CICE Computer Institute official logo" class="brand-logo">\n    </a>\n\n    <button class="menu-toggle"'''
          if old not in s:
              raise SystemExit('Expected About navigation structure not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit About navigation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix About navigation logo link"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-about-logo.yml
          git add .github/workflows/fix-about-logo.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary navigation fix workflow"
          git push
