name: Add founder qualification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MSc IT qualification
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('about.html')
          text = path.read_text(encoding='utf-8')
          old = '<div class="founder-detail"><small>QUALIFICATION</small><strong>To Be Added Later</strong></div>'
          new = '<div class="founder-detail"><small>QUALIFICATION</small><strong>MSc IT</strong></div>'
          if old not in text:
              raise SystemExit('Expected qualification block not found; no changes made.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Add founder MSc IT qualification"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/add-mihir-qualification.yml
          git add .github/workflows/add-mihir-qualification.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove temporary qualification workflow"
          git push
