name: Remove About Page Logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visible logo from About page only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          old = '''    <a href="index.html" class="brand" aria-label="CICE Computer Institute - Home">\n        <img src="assets/images/cice-logo.png" alt="CICE Computer Institute official logo" class="brand-logo">\n    </a>'''
          old_nav = '''    <a href="index.html" class="brand" aria-label="CICE Computer Institute - Home">\n        <img src="assets/images/cice-logo-nav.png" alt="CICE Computer Institute official logo" class="brand-logo">\n    </a>'''
          if old in s:
              s = s.replace(old, '', 1)
          elif old_nav in s:
              s = s.replace(old_nav, '', 1)
          else:
              raise SystemExit('About page logo block not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit About page change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Remove logo from About page" || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/remove-about-logo.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary logo workflow"
          git push
