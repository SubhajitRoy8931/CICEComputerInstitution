name: Apply founder qualification update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-founder-qualification.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update founder credentials
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          old = '''                <div class="experience-chip"><strong>10+ Years</strong><span>Teaching Experience</span></div>'''
          new = '''                <div class="founder-credentials" aria-label="Founder credentials">
                    <span class="founder-credential">🎓 MSc IT</span>
                    <span class="founder-credential-separator" aria-hidden="true">·</span>
                    <span class="founder-credential">10+ Years of Teaching Experience</span>
                </div>'''
          if old not in s:
              raise SystemExit('Expected experience chip not found')
          s = s.replace(old, new, 1)
          old2 = '''                <div class="founder-details">
                    <div class="founder-detail"><small>QUALIFICATION</small><strong>To Be Added Later</strong></div>
                </div>'''
          if old2 not in s:
              raise SystemExit('Expected qualification placeholder not found')
          s = s.replace(old2, '', 1)
          css = '''
<style id="founder-credentials-refinement">
.founder-credentials {
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:18px;
    color:var(--muted);
    font-size:.78rem;
    font-weight:700;
}
.founder-credential:first-child {
    color:var(--blue);
    font-weight:800;
}
.founder-credential-separator {
    color:#a9b7c7;
    font-weight:600;
}
@media (max-width:600px) {
    .founder-credentials {
        row-gap:5px;
    }
}
</style>
'''
          marker = '</head>'
          if 'founder-credentials-refinement' not in s:
              s = s.replace(marker, css + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git rm .github/workflows/apply-founder-qualification.yml
          git commit -m "Add founder MSc IT qualification"
          git push
